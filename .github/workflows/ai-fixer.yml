name: AI Auto-Fix CI
on:
  workflow_run:
    workflows: ["C++ CI Pipeline"] # 监听你之前的 C++ 构建流
    types: [completed]

jobs:
  auto-fix:
    # 只有当主 CI 失败时才触发 AI
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout failed commit
        uses: actions/checkout@v4
        with:
          # 精准检出导致失败的那个代码版本
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Run AI Codex Fixer
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/ci-failure.md
