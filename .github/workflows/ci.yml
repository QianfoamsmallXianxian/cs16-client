name: C++ CI Pipeline
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Build Tools
      run: sudo apt-get update && sudo apt-get install -y build-essential
    - name: Compile
      run: make all
    - name: Clean
      run: make clean
